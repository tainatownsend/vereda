<!doctype html><html lang="pt-BR"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vereda — revisão visual isolada</title>
<style>body{margin:0;background:#ded5c7;font:15px system-ui;color:#2c352b}header{padding:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}button,select{font:inherit;min-height:40px}iframe{display:block;margin:0 auto;border:0;height:850px;max-width:100%;background:#f5f0e7}label{display:flex;align-items:center;gap:8px}</style>
<header><strong>QA · dados fictícios · sem acesso à conta</strong><label>Largura <select id="width"><option>320</option><option>360</option><option>375</option><option selected>390</option><option>414</option><option>430</option><option>768</option><option>1024</option><option>1280</option></select></label><label>Tela <select id="route"><option value="/home">Início</option><option value="/biblioteca">Estudos</option><option value="/ler/1">Leitura</option><option value="/reflexoes">Reflexões</option><option value="/mais">Mais</option><option value="/configuracoes">Perfil</option></select></label><label><input type="checkbox" id="dark">Tema escuro</label><label><input type="checkbox" id="empty">Sem progresso</label><label>Texto <select id="scale"><option value="16">Padrão</option><option value="18">Extra</option></select></label></header>
<output id="metrics" aria-label="Medições da tela" style="display:block;padding:0 12px 8px;font-size:12px"></output><iframe title="Vereda em teste" width="390" src="./app.html?route=/home"></iframe>
<script>const frame=document.querySelector('iframe');document.querySelector('#width').onchange=e=>{frame.width=e.target.value;requestAnimationFrame(measure)};for(const id of ['route','dark','empty','scale'])document.querySelector('#'+id).onchange=()=>{frame.src='./app.html?'+new URLSearchParams({route:document.querySelector('#route').value,dark:document.querySelector('#dark').checked,empty:document.querySelector('#empty').checked,scale:document.querySelector('#scale').value})};function measure(){const d=frame.contentDocument;if(!d?.querySelector('main,h1'))return;const w=frame.contentWindow;const el=d.documentElement;const nav=[...d.querySelectorAll('.northstar-nav-item')];document.querySelector('#metrics').textContent=JSON.stringify({route:document.querySelector('#route').value,width:w.innerWidth,scroll:el.scrollWidth,overflow:el.scrollWidth>w.innerWidth,nav:nav.map(n=>({text:n.textContent,font:w.getComputedStyle(n).fontSize,height:Math.round(n.getBoundingClientRect().height)})),images:[...d.images].filter(i=>i.complete&&!i.naturalWidth).length})}frame.addEventListener('load',()=>{new ResizeObserver(measure).observe(frame.contentDocument.documentElement);new MutationObserver(measure).observe(frame.contentDocument.body,{childList:true,subtree:true});measure()});</script></html>
