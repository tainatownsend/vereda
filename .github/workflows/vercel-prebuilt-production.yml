name: Vercel prebuilt production

on:
  push:
    branches:
      - main
      - ci/vercel-prebuilt-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_w8ODivM4xyoFLqiv6YG7ECxy
  VERCEL_PROJECT_ID: prj_ASYYDkhvgMzjQF4M5Z0VG8rVKom5

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Vercel authentication
        run: npx --yes vercel whoami --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull production environment
        run: npx --yes vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build prebuilt production output
        run: npx --yes vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt output to production
        if: github.ref == 'refs/heads/main'
        run: npx --yes vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
