name: Vercel production deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_w8ODivM4xyoFLqiv6YG7ECxy
  VERCEL_PROJECT_ID: prj_ASYYDkhvgMzjQF4M5Z0VG8rVKom5
  VEREDA_PRODUCTION_URL: https://vereda-navy.vercel.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Vercel authentication
        run: npx --yes vercel whoami --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Deploy source with Vercel production environment
        run: npx --yes vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Verify canonical production deployment
        run: npx --yes vercel inspect "$VEREDA_PRODUCTION_URL" --wait --timeout 5m --token="${{ secrets.VERCEL_TOKEN }}"
