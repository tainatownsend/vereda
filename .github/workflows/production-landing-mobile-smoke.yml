name: Production Landing Mobile Smoke

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/LandingPage.jsx'
      - 'src/App.jsx'
      - 'src/main.jsx'
      - 'src/index.css'
      - 'src/focus.css'
      - 'src/landing-mobile.css'
      - 'scripts/landing-mobile-smoke.mjs'
      - 'index.html'
      - '.github/workflows/production-landing-mobile-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-landing-mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VEREDA_SMOKE_URL: https://vereda-navy.vercel.app/
      VEREDA_SMOKE_WAIT_FOR_DEPLOYMENT: 'true'
    steps:
      - name: Checkout smoke script
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate production landing on mobile viewports
        run: node scripts/landing-mobile-smoke.mjs
