name: Production Landing Mobile Smoke

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/LandingPage.jsx'
      - 'src/App.jsx'
      - 'src/main.jsx'
      - 'src/index.css'
      - 'src/focus.css'
      - 'src/landing-mobile.css'
      - 'index.html'
      - '.github/workflows/production-landing-mobile-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-landing-mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VEREDA_PRODUCTION_URL: https://vereda-navy.vercel.app/
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate production landing on mobile viewports
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright'

          const url = process.env.VEREDA_PRODUCTION_URL
          const viewports = [
            { width: 320, height: 568, name: '320x568' },
            { width: 390, height: 844, name: '390x844' },
          ]

          const browser = await chromium.launch({ headless: true })

          async function waitForProductionLanding(page, viewportName) {
            let lastError

            for (let attempt = 1; attempt <= 8; attempt += 1) {
              try {
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45_000 })
                await page.getByRole('heading', { level: 1 }).waitFor({ state: 'visible', timeout: 10_000 })
                console.log(`${viewportName}: production landing ready on attempt ${attempt}`)
                return
              } catch (error) {
                lastError = error
                console.log(`${viewportName}: production not ready yet (attempt ${attempt}/8)`)
                if (attempt < 8) await new Promise((resolve) => setTimeout(resolve, 15_000))
              }
            }

            throw lastError
          }

          try {
            for (const viewport of viewports) {
              const page = await browser.newPage({ viewport })
              const pageErrors = []
              page.on('pageerror', (error) => pageErrors.push(error.message))

              await waitForProductionLanding(page, viewport.name)

              const title = await page.title()
              if (!title.includes('Vereda')) throw new Error(`${viewport.name}: missing Vereda document title`)

              const metadata = await page.evaluate(() => ({
                description: document.querySelector('meta[name="description"]')?.getAttribute('content') || '',
                ogTitle: document.querySelector('meta[property="og:title"]')?.getAttribute('content') || '',
                ogDescription: document.querySelector('meta[property="og:description"]')?.getAttribute('content') || '',
              }))
              if (!metadata.description || !metadata.ogTitle || !metadata.ogDescription) {
                throw new Error(`${viewport.name}: incomplete description/social metadata`)
              }

              const headingSnapshot = await page.evaluate(() => ({
                h1: document.querySelectorAll('h1').length,
                h2: document.querySelectorAll('h2').length,
              }))
              if (headingSnapshot.h1 !== 1 || headingSnapshot.h2 < 1) {
                throw new Error(`${viewport.name}: invalid heading structure ${JSON.stringify(headingSnapshot)}`)
              }

              const routeSnapshot = await page.evaluate(() => ({
                login: Boolean(document.querySelector('a[href="/entrar"]')),
                signup: Boolean(document.querySelector('a[href="/criar-conta"]')),
              }))
              if (!routeSnapshot.login || !routeSnapshot.signup) {
                throw new Error(`${viewport.name}: login/signup routes are not both exposed`)
              }

              const overflow = await page.evaluate(() => {
                const width = window.innerWidth
                const offenders = [...document.body.querySelectorAll('*')]
                  .filter((element) => {
                    const style = getComputedStyle(element)
                    if (style.display === 'none' || style.visibility === 'hidden') return false
                    const rect = element.getBoundingClientRect()
                    return rect.width > 1 && (rect.left < -1 || rect.right > width + 1)
                  })
                  .slice(0, 8)
                  .map((element) => ({
                    tag: element.tagName,
                    text: (element.textContent || '').trim().slice(0, 60),
                    rect: element.getBoundingClientRect().toJSON(),
                  }))
                return {
                  htmlScrollWidth: document.documentElement.scrollWidth,
                  bodyScrollWidth: document.body.scrollWidth,
                  viewportWidth: width,
                  offenders,
                }
              })
              if (
                overflow.htmlScrollWidth > viewport.width + 1 ||
                overflow.bodyScrollWidth > viewport.width + 1 ||
                overflow.offenders.length > 0
              ) {
                throw new Error(`${viewport.name}: horizontal overflow detected ${JSON.stringify(overflow)}`)
              }

              const primaryCtas = page.locator('a[href="/criar-conta"]')
              const ctaCount = await primaryCtas.count()
              let ctaAboveFold = false
              for (let index = 0; index < ctaCount; index += 1) {
                const box = await primaryCtas.nth(index).boundingBox()
                if (
                  box &&
                  box.y >= 0 &&
                  box.y + box.height <= viewport.height &&
                  box.x >= 0 &&
                  box.x + box.width <= viewport.width
                ) {
                  ctaAboveFold = true
                  break
                }
              }
              if (!ctaAboveFold) throw new Error(`${viewport.name}: no signup CTA fully visible above the fold`)

              let visibleFocus = false
              for (let index = 0; index < 6; index += 1) {
                await page.keyboard.press('Tab')
                visibleFocus = await page.evaluate(() => {
                  const active = document.activeElement
                  if (!active || active === document.body) return false
                  const style = getComputedStyle(active)
                  return style.outlineStyle !== 'none' && parseFloat(style.outlineWidth || '0') >= 2
                })
                if (visibleFocus) break
              }
              if (!visibleFocus) throw new Error(`${viewport.name}: keyboard focus is not visibly styled`)

              if (pageErrors.length > 0) {
                throw new Error(`${viewport.name}: page errors: ${pageErrors.join(' | ')}`)
              }

              console.log(`${viewport.name}: PASS`)
              await page.close()
            }
          } finally {
            await browser.close()
          }
          EOF
