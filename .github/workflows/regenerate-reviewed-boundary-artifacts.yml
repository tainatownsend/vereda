name: Regenerate reviewed-boundary artifacts

on:
  push:
    branches:
      - ux/book-request-reference-url
    paths:
      - .github/workflows/regenerate-reviewed-boundary-artifacts.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[skip artifact-regeneration]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild deterministic reviewed-boundary chain
        run: |
          node scripts/content_pipeline/build_reviewed_boundary_consolidated_application_package.mjs
          node scripts/content_pipeline/build_reviewed_boundary_execution_authority.mjs
          node scripts/content_pipeline/build_reviewed_boundary_audit_identity.mjs
          node scripts/content_pipeline/build_reviewed_boundary_content_integrity.mjs
          node scripts/content_pipeline/build_reviewed_boundary_application_rollback.mjs

      - name: Verify generated diff
        run: git diff --check

      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/migration docs/content-pipeline supabase/audits
          if git diff --cached --quiet; then
            echo "No generated artifacts changed."
            exit 0
          fi
          git commit -m "chore(content): refresh reviewed-boundary artifacts [skip artifact-regeneration]"
          git push origin HEAD:ux/book-request-reference-url
