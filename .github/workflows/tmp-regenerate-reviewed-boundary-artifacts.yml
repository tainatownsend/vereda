name: Temporary regenerate reviewed-boundary artifacts

on:
  push:
    branches:
      - feat/book-request-voting
    paths:
      - .github/workflows/tmp-regenerate-reviewed-boundary-artifacts.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/book-request-voting
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align builder migration inventory with validator
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'

          const path = 'scripts/content_pipeline/build_reviewed_boundary_consolidated_application_package.mjs'
          const source = await readFile(path, 'utf8')
          const before = ".filter(f=>f.endsWith('.sql')).sort().map(f=>join(paths.migrationsDir,f))"
          const after = ".filter(f=>f.endsWith('.sql')&&f!=='20260805005500_reviewed_boundary_audit_identity.sql').sort().map(f=>join(paths.migrationsDir,f))"

          if (source.includes(after)) {
            console.log('Builder migration inventory is already aligned.')
          } else if (source.includes(before)) {
            await writeFile(path, source.replace(before, after))
            console.log('Aligned builder migration inventory with validator exclusion rule.')
          } else {
            throw new Error('Expected migration inventory expression was not found; failing closed.')
          }
          NODE

      - name: Regenerate deterministic reviewed-boundary artifacts
        run: |
          npm run content:staging:segments:reviewed-boundary:consolidated:application:build
          npm run content:staging:segments:reviewed-boundary:execution-authority:build
          npm run content:staging:segments:reviewed-boundary:audit-identity:build
          npm run content:staging:segments:reviewed-boundary:content-integrity:build
          npm run content:staging:segments:reviewed-boundary:application-rollback:build
          npm run content:staging:segments:reviewed-boundary:runtime-integrity:build
          npm run content:staging:segments:reviewed-boundary:staging-authorization:build
          npm run content:staging:segments:reviewed-boundary:staging-execution:build
          npm run content:staging:segments:reviewed-boundary:production-readiness:build

      - name: Commit builder fix and regenerated artifacts
        shell: bash
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/content_pipeline/build_reviewed_boundary_consolidated_application_package.mjs content/migration docs/content-pipeline supabase/audits
          if git diff --cached --quiet; then
            echo "No deterministic changes."
            exit 0
          fi
          git commit -m "fix(content): align reviewed-boundary migration inventory"
          git push origin HEAD:feat/book-request-voting
